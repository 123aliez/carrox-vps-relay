# ====== vps-relay managed: DO NOT HAND EDIT ======
# 未知域名的 HTTP 请求直接关闭，TLS 握手直接拒绝，避免泄露业务站点。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol default_server;
    server_name _;
    ssl_reject_handshake on;
}
