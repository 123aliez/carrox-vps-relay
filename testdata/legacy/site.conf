# ====== vps-relay managed: DO NOT HAND EDIT ======
# relay-meta: {"v":2,"domain":"site.example.com","upstream":"https://198.51.100.7:443","owner":"admin","cf_zone":"","cf_record_id":"","created":"2026-11-02T00:00:00Z"}
# =================================================

server {
    listen 80;
    listen [::]:80;
    server_name site.example.com;

    # ACME http-01 passthrough to the origin (for origin-side renewal).
    # ^~ beats regex locations; placed before location / so challenges reach the origin.
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://198.51.100.7:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name site.example.com;

    ssl_certificate     /usr/local/nginx/conf/ssl/site.example.com/fullchain.pem;
    ssl_certificate_key /usr/local/nginx/conf/ssl/site.example.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://198.51.100.7:443;
        proxy_http_version 1.1;

        # Upstream Host: use upstream host name if it's a domain,
        # otherwise pass through the accelerated domain.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE passthrough
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Upstream SNI: use upstream host name if it's a domain,
        # otherwise fall back to the accelerated domain.
        proxy_ssl_server_name on;
        proxy_ssl_name        $host;
        proxy_ssl_verify      off;

        proxy_buffering       off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size  100m;
    }
}
