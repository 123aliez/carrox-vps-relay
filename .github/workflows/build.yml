name: build

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 格式检查（所有 Go 文件）
        run: test -z "$(gofmt -l .)"

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 构建镜像
        run: docker build -t vps-relay:${{ github.sha }} .

      - name: 冒烟测试：容器内 Nginx 能解析 stream 配置
        run: |
          docker run --rm --entrypoint sh vps-relay:${{ github.sha }} -c '
            set -e
            mkdir -p /tmp/ngx/conf/stream.d /tmp/ngx/conf/conf.d /tmp/ngx/logs
            printf "user nobody;\nevents { worker_connections 64; }\nhttp { include conf.d/*.conf; }\nstream { include stream.d/*.conf; }\n" > /tmp/ngx/conf/nginx.conf
            printf "server {\n    listen 24443;\n    proxy_pass 198.51.100.7:443;\n    proxy_timeout 1h;\n}\n" > /tmp/ngx/conf/stream.d/relay-tcp-24443.conf
            nginx -p /tmp/ngx -c /tmp/ngx/conf/nginx.conf -g "load_module /usr/lib/nginx/modules/ngx_stream_module.so;" -t
            test -f /opt/vps-relay/templates/tcp.conf.tmpl
          '

      - name: 冒烟测试：SNI 分流、伪装站和 Xray 配置
        run: |
          docker run --rm --entrypoint sh -v "$PWD/testdata/m15:/fixtures:ro" -v "$PWD/scripts/smoke-sni443.sh:/smoke-sni443.sh:ro" vps-relay:${{ github.sha }} /smoke-sni443.sh

      - name: 导出镜像
        run: |
          docker tag vps-relay:${{ github.sha }} vps-relay:m15
          docker save vps-relay:m15 | gzip > vps-relay-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: vps-relay-image
          path: vps-relay-image.tar.gz
          retention-days: 14
