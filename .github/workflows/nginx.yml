name: nginx

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths: ['.github/workflows/nginx.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential libpcre2-dev libssl-dev zlib1g-dev
      - name: 下载并校验源码
        run: |
          curl --fail --location --output nginx-1.28.0.tar.gz https://nginx.org/download/nginx-1.28.0.tar.gz
          echo 'c6b5c6b086c0df9d3ca3ff5e084c1d0ef909e6038279c71c1c3e985f576ff76a  nginx-1.28.0.tar.gz' | sha256sum --check
          tar -xzf nginx-1.28.0.tar.gz
      - name: 构建并确认 ssl_preread
        working-directory: nginx-1.28.0
        run: |
          ./configure --prefix=/usr/local/nginx --user=www --group=www --with-http_ssl_module --with-http_v2_module --with-http_v3_module --with-stream --with-http_realip_module --with-http_stub_status_module --with-http_gzip_static_module --with-threads --with-stream_ssl_preread_module
          make -j"$(nproc)"
          mkdir -p ../artifact
          objs/nginx -V 2>&1 | tee ../artifact/nginx-V.txt
          grep -q -- '--with-stream_ssl_preread_module' ../artifact/nginx-V.txt
          cp objs/nginx ../artifact/nginx
          cd ../artifact
          sha256sum nginx nginx-V.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nginx-1.28.0-preread
          path: artifact/
          retention-days: 14
